<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <link rel="stylesheet" href="index.css">
</head>

<body>
   <h2>The winner is boss himself</h2>
   <form action="" id="form">

      <div>
         <label for="username">Name:</label>
         <input type="text" id="username" placeholder="Enter your name">
         <span class="Error" style="color: red;"></span>
      </div>

      

      <div>
         <label for="email">Email:</label>
         <input type="email" id="email" placeholder="Enter your email">
          <span class="Error" style="color: red;"></span>
         
  

      </div>

      <div>

         <label for="password">Password:</label>
         <input type="password" id="password" placeholder="Enter your password">
          <span class="Error" style="color: red;"></span>

      
        
      </div>

      <p id="passwordHint" class="hidden"> Must be at least 8 characters</p>

     <div>
         <label for="bio">Bio :</label>
         <textarea name="bio" id="bio" placeholder="Enter your bio..."></textarea>
         <span class="Error" style="color: red;"></span>
         <p id="word-count">150 words remaining</p>
         your name">
         
      </div>

      <div>
         <input type="checkbox" id="checkbox">
         <label for="checkbox" id="checkox">I agree with terms and conditions</label>

      </div>

      <div>
         <label for="country">Country:</label>
         <select name="country" id="country">
            <option value="usa">USA</option>
            <option value="canada">Canada</option>
            <option value="uk">UK</option>
         </select>
      </div>

      <div>
         <button id="btn" type="submit">Create Account</button>
         </div>

      <div>

         <h1 class="hidden">Congratulations. You sucessfully created an account🎉</h1>

   </form>

   <script src="index.js"></script>
</body>

</html>
